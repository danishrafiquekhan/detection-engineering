title: Potential Password Spray Against Azure AD
id: 4c1a9e3d-5b7f-4a6e-8d2c-3f4a5b6c7d8e
status: experimental
description: >
  Flags failed sign-in events that match common password-spray failure codes.
  This rule expresses the per-event condition only — the "many accounts, one
  source, short window" aggregation is added in the KQL layer (Sigma has no
  clean single-rule way to express cross-account aggregation; see the
  generated .kql file and the README for the summarize clause added by hand).
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Danish Khan
date: 2026-08-29
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  category: authentication
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType:
      - 50053  # account locked
      - 50126  # invalid username or password
  condition: selection
falsepositives:
  - Shared corporate NAT/VPN egress IP causing many users to appear to share a source IP
  - A single user genuinely mistyping their password multiple times
level: high
