title: Suspicious Sign-in Velocity (Impossible Travel)
id: 7f2a6e1c-2b3d-4e2a-9c1a-0a1b2c3d4e5f
status: experimental
description: >
  Detects a single account signing in from two different countries within a
  short time window, which is not physically possible and typically indicates
  credential compromise or a shared/leaked session token.
references:
  - https://attack.mitre.org/techniques/T1078/004/
author: Danish Khan
date: 2026-08-29
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  category: authentication
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType: 0
  condition: selection
falsepositives:
  - Users travelling with VPN or corporate proxy exit nodes that shift apparent location
  - Users legitimately signing in from multiple regions close together via cloud services
level: high
